<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" role="img" aria-labelledby="title desc">
  <title id="title">0516 Survey26 Observer architecture</title>
  <desc id="desc">Public inputs update the observation ledger and operational constraints. Two-stage model advice informs field and shared-exposure optimization. A validated action yields feedback for the next decision, under a CPU and wall-time budget.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#101e36"/><stop offset="1" stop-color="#07101d"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#829aba"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .label { fill:#9ab0cd; font-size:15px; letter-spacing:1px; }
      .title { fill:#f2f6ff; font-size:23px; font-weight:600; }
      .body { fill:#c5d2e6; font-size:18px; }
      .small { fill:#9fb3ce; font-size:16px; }
      .card { fill:#15253d; stroke:#2c4567; stroke-width:1.3; }
      .line { fill:none; stroke:#829aba; stroke-width:2; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="890" rx="24" fill="url(#sky)"/>
  <circle cx="1180" cy="65" r="24" fill="none" stroke="#45d3bd" stroke-width="1.5"/>
  <ellipse cx="1180" cy="65" rx="44" ry="11" transform="rotate(-30 1180 65)" fill="none" stroke="#45d3bd"/>
  <text x="42" y="49" class="label">GOSIM 2026 · AGENTIC OBSERVER · v0.73</text>
  <text x="40" y="99" fill="#ffffff" font-size="38" font-weight="650">0516 / 从公开信息到一次曝光</text>

  <rect x="40" y="140" width="1200" height="104" rx="16" class="card"/>
  <text x="64" y="176" class="title">公开输入</text>
  <text x="64" y="215" class="body">星表 · 台址 · 光纤布局 · 夜历 · 计分参数</text>
  <text x="650" y="176" class="small">initialize / decision_request</text>
  <text x="650" y="215" class="body">预报与值班日志 · 请求进度 · 上次动作反馈</text>

  <path d="M220 244 V284" class="line"/><path d="M640 244 V284" class="line"/><path d="M1060 244 V284" class="line"/>
  <rect x="40" y="292" width="360" height="146" rx="15" class="card"/>
  <rect x="40" y="292" width="5" height="146" rx="2" fill="#45d3bd"/>
  <text x="64" y="329" class="title">状态与反馈校准</text>
  <text x="64" y="364" class="body">最高分账本 · 完成度 · 可见窗口</text>
  <text x="64" y="396" class="body">质量 / program 分离 · 指向校准</text>
  <text x="64" y="422" class="small">state.py / calibration.py</text>

  <rect x="460" y="292" width="360" height="146" rx="15" class="card"/>
  <rect x="460" y="292" width="5" height="146" rx="2" fill="#e2b66f"/>
  <text x="484" y="329" class="title">运营事件编译</text>
  <text x="484" y="364" class="body">相机报修 · 测试窗 · 多夜停机</text>
  <text x="484" y="396" class="body">山脊 · 风关闭 · 推迟与更正</text>
  <text x="484" y="422" class="small">dutylog.py / shutdown.py / terrain.py</text>

  <rect x="880" y="292" width="360" height="146" rx="15" class="card"/>
  <rect x="880" y="292" width="5" height="146" rx="2" fill="#a99af5"/>
  <text x="904" y="329" class="title">双阶段模型建议</text>
  <text x="904" y="364" class="body">forecast_plan → feedback_review</text>
  <text x="904" y="396" class="body">方向与时长建议 · 事件触发复核</text>
  <text x="904" y="422" class="small">llm_client.py</text>

  <path d="M220 438 V482" class="line"/><path d="M640 438 V482" class="line"/><path d="M1060 438 V482" class="line" stroke-dasharray="6 5"/>
  <rect x="40" y="490" width="1200" height="180" rx="16" fill="#143638" stroke="#45d3bd" stroke-width="1.5"/>
  <text x="64" y="528" class="title">确定性在线调度 · Planner</text>
  <text x="64" y="558" class="small">用共同曝光下的组合边际收益 / 耗时比较候选</text>
  <rect x="64" y="582" width="248" height="58" rx="10" fill="#1e484a"/>
  <text x="88" y="618" class="body">区域 / 目标候选入口</text>
  <path d="M324 611 H352" class="line"/>
  <rect x="365" y="582" width="248" height="58" rx="10" fill="#1e484a"/>
  <text x="389" y="618" class="body">光纤分配与边界精修</text>
  <path d="M625 611 H653" class="line"/>
  <rect x="666" y="582" width="248" height="58" rx="10" fill="#1e484a"/>
  <text x="690" y="618" class="body">共同曝光 / program</text>
  <path d="M926 611 H954" class="line"/>
  <rect x="967" y="582" width="248" height="58" rx="10" fill="#1e484a"/>
  <text x="990" y="618" class="body">required / 请求收益</text>

  <path d="M220 724 V680" class="line"/><path d="M640 670 V716" class="line"/>
  <rect x="40" y="724" width="360" height="102" rx="15" class="card"/>
  <text x="64" y="762" class="title">预算与计算复用</text>
  <text x="64" y="799" class="body">CPU 三档搜索 · 缓存 · 模型时限</text>
  <rect x="460" y="724" width="360" height="102" rx="15" class="card"/>
  <text x="484" y="762" class="title">动作校验 → JSONL 输出</text>
  <text x="484" y="799" class="body">observe / wait / report / finish</text>
  <path d="M820 775 H871" class="line"/>
  <rect x="880" y="724" width="360" height="102" rx="15" class="card"/>
  <text x="904" y="762" class="title">新反馈 → 下一轮规划</text>
  <text x="904" y="799" class="body">命中得分 · 请求进度 · 报修结果</text>
  <text x="40" y="863" class="small">执行一步，更新状态，再选择下一次曝光。</text>
  <text x="1005" y="863" class="small">0516 · Survey26 Observer</text>
</svg>
